; NOTE: this file is read with the system locale encoding, so keep it ASCII-only.
; Chinese notes for migrations live in alembic/env.py and the version files.

[alembic]
script_location = alembic
prepend_sys_path = .
; The URL is injected by alembic/env.py from DATABASE_URL in .env -- leave blank.
sqlalchemy.url =

; Timestamped filenames keep versions sortable when several people add migrations.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
